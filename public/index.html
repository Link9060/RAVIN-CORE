<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>RAVIN Core</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">RESONANT</div>
        <div class="brand">RAVIN CORE</div>
      </div>
      <button id="modeButton" class="mode-button" type="button">CONVERSATION</button>
    </header>

    <section class="core-stage" aria-live="polite">
      <button id="coreButton" class="core ready" type="button" aria-label="RAVIN Core">
        <span class="core-glow"></span>
        <span class="core-dot"></span>
      </button>
      <div id="stateLabel" class="state-label">READY</div>
      <div id="statusText" class="status-text">Core link online</div>
    </section>

    <section class="conversation" id="conversation"></section>

    <form id="composer" class="composer">
      <textarea
        id="messageInput"
        rows="1"
        maxlength="12000"
        placeholder="Ask RAVIN..."
        autocomplete="off"
      ></textarea>
      <button id="sendButton" type="submit">Send</button>
    </form>

    <div class="footer-actions">
      <button id="speakToggle" class="ghost-button" type="button">VOICE ON</button>
      <button id="resetButton" class="ghost-button" type="button">NEW SESSION</button>
    </div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
